# 依存の更新を月 1 回、PR で提案する（マージ前に CI とレビューを通す）
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
  - package-ecosystem: gradle
    directory: /sample-app
    schedule: {interval: monthly}
    open-pull-requests-limit: 5
  # local/ には Dockerfile が無く docker-compose.yml だけなので、docker ではなく docker-compose を使う
  # （docker だと「Dockerfile が見つからない」で失敗する）. イメージは タグ@sha256:digest で固定しており、タグと digest を一緒に更新する
  - package-ecosystem: docker-compose
    directory: /local
    schedule: {interval: monthly}
    open-pull-requests-limit: 5
  # provider の版は各環境の versions.tf と .terraform.lock.hcl で固定している。全環境・簡易環境・モジュールを対象にする
  - package-ecosystem: terraform
    directories:
      - /cloud/environments/dev1
      - /cloud/environments/stg
      - /cloud/environments/prod
      - /cloud/simple
      - /cloud/modules/*
    schedule: {interval: monthly}
    open-pull-requests-limit: 5
    groups:
      terraform-providers:
        patterns: ["*"]
